[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-office-writer"
version = "0.6.0"
description = "MCP server for creating and editing Office documents (Word, Excel, PowerPoint)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0,<2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.28.0",
    "fpdf2>=2.8.0",
    "pywin32>=312; sys_platform == 'win32'",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
    "xlsxwriter>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["mcp_office_writer*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E402: __init__.py 必须在导入第三方库前先配置 stdio UTF-8（_configure_stdio_utf8），
# 该模块级 import 位置是刻意的。
ignore = ["E402"]
